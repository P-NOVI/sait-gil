# 개발용 수집 DB(PostgreSQL). 저장소 루트에서 `docker compose up -d` 로 켠다.
# 배포(Render·Actions)는 Neon 을 쓴다. 비밀번호는 같은 폴더의 .env(POSTGRES_PASSWORD)에서 읽는다.
# 배리어프리 DB 컨테이너(5432)와 함께 켤 수 있게 호스트 포트를 POSTGRES_PORT(기본 5433)로 둔다.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: saitgil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?루트 .env 에 POSTGRES_PASSWORD 를 넣어 주세요}
      POSTGRES_DB: saitgil
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saitgil -d saitgil"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
