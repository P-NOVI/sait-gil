name: PR Title Prefix

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  prefix-title:
    runs-on: ubuntu-latest
    steps:
      - name: 제목 앞에 [#이슈번호] 추가
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            // 본문의 Closes #번호 (close-issue-on-dev-merge.yml과 같은 규칙)
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i;
            const match = (pr.body ?? '').match(pattern);
            if (!match) return;
            const prefix = `[#${match[1]}]`;
            if (pr.title.startsWith(prefix)) return;
            const rest = pr.title.replace(/^\[#\d+\]\s*/, '');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: `${prefix} ${rest}`,
            });
