# 6시간마다 서울 실시간 인구데이터(주요 장소 현재값·12시간 예측)를 받아 수집 DB(Neon)에 쌓는다.
# backend/app/collector 참고. 길찾기는 이 값을 읽기만 하고 도시데이터를 부르지 않는다.
# 수집 전에 dev 의 수집 DB 마이그레이션(backend/migrations/collector)을 적용한다.
# 예약 실행은 기본 브랜치(main)에 있는 이 파일로만 돈다. 코드는 dev 에서 받는다.
# 필요한 저장소 Secrets: COLLECTOR_DATABASE_URL(Neon pooler 주소), SEOUL_API_KEY
name: Collect citydata

on:
  schedule:
    # 03:17, 09:17, 15:17, 21:17 KST. 예측이 12시간치라 6시간 간격이면 늘 이어진다.
    # 정각은 GitHub 예약 실행이 몰려 늦어지기 쉽다.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-citydata
  cancel-in-progress: false

env:
  # 장소 목록으로 쓰는 영역 파일 (pipeline/ 결과를 Release 에 올린 주소)
  CITYDATA_AREAS_URL: https://github.com/P-NOVI/sait-gil/releases/download/data-v1/citydata_areas.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: astral-sh/setup-uv@v6
      - name: 영역 파일 받기
        run: |
          mkdir -p ../data/processed
          curl -fsSL "$CITYDATA_AREAS_URL" -o ../data/processed/citydata_areas.json
      - name: 수집 DB 마이그레이션
        run: uv run --frozen --no-dev python -m app.migrate collector
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
      - name: 수집
        run: uv run --frozen --no-dev python -m app.collector citydata
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
